<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>Журнал заявок — HomeFlowe</title>
  <style>
    :root { --ink:#17231f; --green:#164937; --line:#d9e2dc; --paper:#f5f6f2; --muted:#66746d; }
    * { box-sizing:border-box; } body { margin:0; background:var(--paper); color:var(--ink); font:15px/1.5 Arial,sans-serif; }
    header { background:#164937; color:#fff; padding:20px; } header div, main { max-width:1080px; margin:auto; } h1 { margin:0; font:700 28px Georgia,serif; }
    main { padding:32px 20px 60px; } .panel { background:#fff; border:1px solid var(--line); border-radius:16px; padding:22px; box-shadow:0 12px 35px #1732250d; }
    label { display:block; margin-bottom:7px; font-weight:700; } input { width:min(560px,100%); padding:13px 14px; border:1px solid #aebcb4; border-radius:9px; font:inherit; }
    button { border:0; border-radius:9px; background:var(--green); color:white; padding:13px 18px; font:700 15px Arial,sans-serif; cursor:pointer; margin:12px 0 0; }
    button:disabled { opacity:.55; cursor:wait; } .note, .status { color:var(--muted); max-width:750px; } .status { margin:14px 0 0; } .error { color:#a11e1e; }
    #results { margin-top:28px; } .summary { color:var(--muted); margin:0 0 14px; }
    .submission { background:#fff; border:1px solid var(--line); border-radius:12px; padding:18px; margin:12px 0; } .submission h2 { font:700 18px Georgia,serif; margin:0 0 6px; }
    .time { color:var(--muted); font-size:13px; margin-bottom:12px; } dl { margin:0; display:grid; grid-template-columns:minmax(115px,180px) 1fr; gap:8px 16px; } dt { color:var(--muted); } dd { margin:0; white-space:pre-wrap; overflow-wrap:anywhere; }
    @media (max-width:600px) { main { padding:20px 12px 40px; } .panel { padding:17px; } dl { grid-template-columns:1fr; gap:2px; } dd { margin:0 0 10px; } }
  </style>
</head>
<body>
  <header><div><h1>HomeFlowe · журнал заявок</h1></div></header>
  <main>
    <section class="panel" aria-labelledby="accessTitle">
      <h2 id="accessTitle">Просмотр заявок</h2>
      <p class="note">Введите API-ключ FormSubmit из письма. Ключ используется только для этого запроса и не сохраняется на странице, в браузере или в каталоге.</p>
      <label for="apiKey">API-ключ</label>
      <input id="apiKey" type="password" autocomplete="off" spellcheck="false" aria-describedby="keyHelp">
      <p class="note" id="keyHelp">Страница не добавлена в меню и закрыта от поисковой индексации. Не передавайте ключ другим людям.</p>
      <button id="loadButton" type="button">Загрузить заявки</button>
      <p class="status" id="status" role="status" aria-live="polite"></p>
    </section>
    <section id="results" aria-live="polite"></section>
  </main>
  <script>
    const keyInput = document.getElementById('apiKey');
    const button = document.getElementById('loadButton');
    const status = document.getElementById('status');
    const results = document.getElementById('results');
    const escapeHtml = value => String(value ?? '').replace(/[&<>"']/g, char => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' })[char]);
    const labelMap = { name:'Имя', phone:'Телефон', email:'Электронная почта', message:'Заявка', comment:'Комментарий' };
    function renderSubmission(item) {
      const data = item.form_data || {};
      const time = item.submitted_at?.date || 'Дата не указана';
      const keys = Object.keys(data).filter(key => !key.startsWith('_') && key !== 'agree' && data[key] !== '');
      const rows = keys.map(key => `<dt>${escapeHtml(labelMap[key] || key)}</dt><dd>${escapeHtml(data[key])}</dd>`).join('');
      return `<article class="submission"><h2>${escapeHtml(data.name || 'Заявка')}</h2><div class="time">${escapeHtml(time)}</div><dl>${rows || '<dd>В заявке нет данных.</dd>'}</dl></article>`;
    }
    async function loadSubmissions() {
      const key = keyInput.value.trim();
      if (!key) { status.textContent = 'Введите API-ключ из письма FormSubmit.'; status.className = 'status error'; return; }
      button.disabled = true; status.className = 'status'; status.textContent = 'Загружаем заявки…'; results.innerHTML = '';
      try {
        const response = await fetch(`https://formsubmit.co/api/get-submissions/${encodeURIComponent(key)}`, { headers:{ Accept:'application/json' }, cache:'no-store' });
        const payload = await response.json();
        if (!response.ok || !payload.success) throw new Error(payload.message || `Ошибка ${response.status}`);
        const submissions = Array.isArray(payload.submissions) ? payload.submissions : [];
        status.textContent = 'Заявки загружены.';
        results.innerHTML = `<p class="summary">Всего заявок: ${submissions.length}</p>${submissions.map(renderSubmission).join('') || '<div class="submission">Заявок пока нет.</div>'}`;
      } catch (error) {
        status.textContent = `Не удалось загрузить заявки: ${error.message}. Проверьте ключ и интернет.`;
        status.className = 'status error';
      } finally { button.disabled = false; }
    }
    button.addEventListener('click', loadSubmissions);
    keyInput.addEventListener('keydown', event => { if (event.key === 'Enter') loadSubmissions(); });
  </script>
</body>
</html>
